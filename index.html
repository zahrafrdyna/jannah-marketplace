<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toko buah</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h3>TokoBoneka</h3>
      <nav>
        <a href="#produk">produk</a>
        <a href="#kontak">kontak</a>
        <a href="#">keranjang (<span id="cart-cont">0</span>)</a>
      </nav>
    </header>
    <main>
      <div class="card-container">
        <div class="card">
          <img src="Dragon fruit cat 🐱.jpg" alt="" id="gambar-pertama" />
          <h3>Kucing segar!</h3>
          <p>Rp. 15.000.000</p>
          <div class="tambah-kuantitas">
            <button class="qty-min">-</button>
            <input type="text" value="0" readonly class="qty-value"/>
            <button class="qty-plus">+</button>
          </div>
          <button class="button-beli">Beli Sekarang</button>
        </div>
        <div class="card">
          <img src="Dragon fruit cat 🐱.jpg" alt="" />
          <h3>Kucing buah segar</h3>
          <p>Rp. 10.000.000</p>
          <div class="tambah-kuantitas">
            <button class="qty-min">-</button>
            <input type="text" value="0" readonly class="qty-value" />
            <button class="qty-plus">+</button>
          </div>
          <button class="button-beli">Beli Sekarang</button>
        </div>
        <div class="card">
          <img src="Dragon fruit cat 🐱.jpg" alt="" />
          <h3>Kucng buah!</h3>
          <p>Rp. 15.000.000</p>
          <div class="tambah-kuantitas">
            <button class="qty-min">-</button>
            <input type="text" value="0" readonly class="qty-value"/>

          </div>
          <button class="button-beli">Beli Sekarang</button>
        </div>
        <div class="card">
          <img src="Dragon fruit cat 🐱.jpg" alt="" id="gambar-keempat" />
          <h3>Kucing buah!</h3>
          <p>Rp. 15.000.000</p>
          <div class="tambah-kuantitas">
            <button class="qty-min">-</button>
            <input type="text" value="0" readonly class="qty-value" />
            <button class="qty-plus">+</button>
          </div>
          <button class="button-beli">Beli Sekarang</button>
        </div>
        <div class="card">
          <img src="Dragon fruit cat 🐱.jpg" alt="" />
          <h3>Kucing buah!</h3>
          <p>Rp. 15.000.000</p>
          <div class="tambah-kuantitas">
            <button class="qty-min">-</button>
            <input type="text" value="0" readonly class="qty-value" />
            <button class="qty-plus">+</button>
          </div>
          <button class="button-beli">Beli Sekarang</button>
        </div>
      </div>
    </main>
    <footer>

      <div>
        <h3>hubungi saya</h3>
        <form class="kontak">
          <label for="name">nama:</label>
          <input type=" text" placeholder="full name" id="name">
          <label for="Email">Email</label>
          <input type="Email" placeholder="contoh@gmail.com" id="Email">
          <label for="pesan">pesan</label>
          <textarea name="pesan" id="pesan"></textarea>
          <button type="button">kirim pesan</button>
        </form>
      </div>

    </footer>
    <script src="script.js"></script>
  </body>
</html>
